# Firebase App Hosting configuration
# Docs: https://firebase.google.com/docs/app-hosting/configure
runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0          # Scale to zero when no traffic (saves cost)
  maxInstances: 10
  concurrency: 80
# Environment variables — set the secrets with:
#   firebase apphosting:secrets:set DATABASE_URL
#   firebase apphosting:secrets:set FIREBASE_PROJECT_ID
#   firebase apphosting:secrets:set FIREBASE_CLIENT_EMAIL
#   firebase apphosting:secrets:set FIREBASE_PRIVATE_KEY
environmentVariables:
  - variable: DATABASE_URL
    secret: DATABASE_URL
  - variable: FIREBASE_PROJECT_ID
    secret: FIREBASE_PROJECT_ID
  - variable: FIREBASE_CLIENT_EMAIL
    secret: FIREBASE_CLIENT_EMAIL
  - variable: FIREBASE_PRIVATE_KEY
    secret: FIREBASE_PRIVATE_KEY
# Public (non-secret) env vars — these are baked into the build and
# visible in the browser, so only put public Firebase config here.
publicEnvironmentVariables:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "your-api-key-here"
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "your-project.firebaseapp.com"
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "your-project-id"
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:1234567890:web:abcdef"
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "1234567890"
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "your-project.appspot.com"
